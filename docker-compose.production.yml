services:
  reverse-proxy:
    image: traefik:v3.2
    restart: unless-stopped
    command: ["--providers.docker=true","--providers.docker.exposedbydefault=false","--entrypoints.web.address=:80","--entrypoints.web.http.redirections.entrypoint.to=websecure","--entrypoints.web.http.redirections.entrypoint.scheme=https","--entrypoints.websecure.address=:443","--certificatesresolvers.letsencrypt.acme.tlschallenge=true","--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}","--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"]
    ports: ["80:80","443:443"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro","letsencrypt:/letsencrypt"]
    logging: {options: {max-size: "10m", max-file: "3"}}
  app:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${WEB_DOMAIN}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Jakarta}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on: {postgres: {condition: service_healthy}}
    labels: ["traefik.enable=true","traefik.http.routers.app.rule=Host(`${WEB_DOMAIN}`)","traefik.http.routers.app.entrypoints=websecure","traefik.http.routers.app.tls.certresolver=letsencrypt","traefik.http.services.app.loadbalancer.server.port=3000"]
    deploy: {resources: {limits: {memory: 1024M}}}
    logging: {options: {max-size: "10m", max-file: "3"}}
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: {POSTGRES_DB: "${POSTGRES_DB}", POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5}
volumes: {postgres-data: {}, letsencrypt: {}}
