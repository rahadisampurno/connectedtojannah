services:
  reverse-proxy:
    image: traefik:v3.2
    restart: unless-stopped
    command: ["--providers.docker=true","--providers.docker.exposedbydefault=false","--entrypoints.web.address=:80","--entrypoints.web.http.redirections.entrypoint.to=websecure","--entrypoints.web.http.redirections.entrypoint.scheme=https","--entrypoints.websecure.address=:443","--certificatesresolvers.letsencrypt.acme.tlschallenge=true","--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}","--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"]
    ports: ["80:80","443:443"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro","letsencrypt:/letsencrypt"]
    logging: {options: {max-size: "10m", max-file: "3"}}
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    labels: ["traefik.enable=true","traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)","traefik.http.routers.api.entrypoints=websecure","traefik.http.routers.api.tls.certresolver=letsencrypt","traefik.http.services.api.loadbalancer.server.port=3000"]
    deploy: {resources: {limits: {memory: 768M}}}
    logging: {options: {max-size: "10m", max-file: "3"}}
  web:
    build:
      context: ./web
      args: {NEXT_PUBLIC_API_URL: "https://${API_DOMAIN}/v1"}
    restart: unless-stopped
    depends_on: [api]
    labels: ["traefik.enable=true","traefik.http.routers.web.rule=Host(`${WEB_DOMAIN}`)","traefik.http.routers.web.entrypoints=websecure","traefik.http.routers.web.tls.certresolver=letsencrypt","traefik.http.services.web.loadbalancer.server.port=3000"]
    deploy: {resources: {limits: {memory: 512M}}}
    logging: {options: {max-size: "10m", max-file: "3"}}
  worker:
    build: ./api
    restart: unless-stopped
    env_file: .env
    command: ["node","dist/src/main.js"]
    profiles: ["future-worker"]
  admin:
    image: nginx:alpine
    restart: unless-stopped
    profiles: ["future-admin"]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: {POSTGRES_DB: "${POSTGRES_DB}", POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 10s, timeout: 3s, retries: 5}
volumes: {postgres-data: {}, redis-data: {}, letsencrypt: {}}
